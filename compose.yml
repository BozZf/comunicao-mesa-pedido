services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mesapedido
      POSTGRES_USER: ${DB_USER:-mesapedido}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d mesapedido"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/mesapedido
      DB_USER: ${DB_USER:-mesapedido}
      DB_PASSWORD: ${DB_PASSWORD}
      CASHIER_USER: ${CASHIER_USER:-caixa}
      CASHIER_PASSWORD: ${CASHIER_PASSWORD:?Defina CASHIER_PASSWORD no .env}
      APP_BASE_URL: ${APP_BASE_URL:?Defina APP_BASE_URL no .env}
      PAYMENT_MODE: mercadopago
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:?Defina MP_ACCESS_TOKEN no .env}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
